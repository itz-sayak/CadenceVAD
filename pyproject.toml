[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadencevad"
version = "0.2.0"
description = "Causal streaming voice activity detector with a learnable modulation filterbank"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "models/cadencevad-v0.1/MODEL_LICENSE.md",
]
authors = [{ name = "Sayak Dutta" }]
keywords = ["vad", "voice-activity-detection", "telephony", "webrtc", "onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "scipy>=1.14",
  "soundfile>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "torch>=2.6",
]
data = [
  "datasets[audio]>=4.0,<5",
]
export = [
  "onnx>=1.17",
  "onnxscript>=0.5",
  "torch>=2.6",
]
livekit = [
  "livekit-agents>=1.6,<2",
]
pipecat = [
  "pipecat-ai>=1.6,<2",
]
teachers = [
  "kaldi-native-fbank>=1.21.3",
  "kaldiio>=2.18.0",
  "onnxruntime>=1.20",
  "torch>=2.6",
]
training = [
  "torch>=2.6",
]

[project.scripts]
cadencevad = "cadencevad.cli:main"

[project.urls]
Homepage = "https://github.com/itz-sayak/CadenceVAD"
Repository = "https://github.com/itz-sayak/CadenceVAD"
Issues = "https://github.com/itz-sayak/CadenceVAD/issues"

[[tool.uv.index]]
# The RTX 4090 host runs driver 570.86.10 (CUDA 12.8). The default PyPI torch wheel is
# built against CUDA 13 and fails to initialize here, so torch is pinned to the cu126
# build, which is minor-version compatible with any 12.x driver >= 12.6.
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/cadencevad"]

[tool.hatch.build.targets.wheel.force-include]
"native/macos" = "cadencevad/_native/macos"
"native/portable" = "cadencevad/_native/portable"
"models/cadencevad-v0.1/cadencevad-stream.onnx" = "cadencevad/_models/cadencevad-stream.onnx"
"models/cadencevad-v0.1/cadencevad-stream.json" = "cadencevad/_models/cadencevad-stream.json"
"models/cadencevad-v0.1/MODEL_LICENSE.md" = "cadencevad/_models/MODEL_LICENSE.md"
"NOTICE" = "cadencevad/_models/NOTICE.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
